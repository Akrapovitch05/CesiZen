security:
    # Un administrateur dispose de tous les droits d'un utilisateur.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    password_hashers:
        # « auto » selectionne le meilleur algorithme disponible : aujourd'hui
        # bcrypt, demain Argon2id sans changement de code. Les hachages
        # existants restent valides et sont migres a la connexion suivante.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                always_use_default_target_path: true
                # Sans jeton CSRF, un site tiers peut forcer la connexion d'un
                # visiteur sur un compte qu'il controle, puis observer ce que
                # la victime y depose.
                enable_csrf: true

            # --- Protection contre les attaques par force brute -------------
            # Exigence explicite du cahier des charges. Symfony applique deux
            # limites simultanees : par couple IP + identifiant, et par IP
            # seule, ce qui couvre aussi le balayage d'identifiants
            # (« credential stuffing ») depuis une meme source.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: /logout
                target: app_login
                # Empeche un tiers de deconnecter un utilisateur a son insu.
                enable_csrf: true

    # --- Controle d'acces ---------------------------------------------------
    # Regles evaluees dans l'ordre : la premiere correspondance l'emporte.
    # Les chemins publics sont declares explicitement avant les regles
    # restrictives, pour eviter tout blocage involontaire.
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/inscription$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/activites, roles: PUBLIC_ACCESS }
        - { path: ^/exercices?, roles: PUBLIC_ACCESS }

        # Documentation de l'API : publique, elle ne revele aucune donnee.
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/contexts, roles: PUBLIC_ACCESS }
        # Les operations de l'API sont protegees ressource par ressource dans
        # les entites. Cette regle est une seconde barriere : meme si une
        # entite etait exposee par erreur, l'ecriture resterait interdite aux
        # visiteurs anonymes.
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: ROLE_USER }

        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage volontairement faible en test : la suite cree de
            # nombreux comptes, et un bcrypt a cout reel la rendrait
            # inutilisable. Cette configuration ne s'applique qu'a APP_ENV=test.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

        firewalls:
            main:
                # La limitation de debit fausserait les tests d'authentification,
                # qui enchainent volontairement les echecs de connexion.
                login_throttling:
                    max_attempts: 1000
                    interval: '15 minutes'
