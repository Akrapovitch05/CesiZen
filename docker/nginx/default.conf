server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # --- En-têtes de sécurité (plan de sécurisation) ---------------------
    # Empêche l'affichage du site dans une iframe tierce (clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Interdit au navigateur de deviner le type MIME d'une réponse.
    add_header X-Content-Type-Options "nosniff" always;
    # Ne transmet pas l'URL complète aux domaines tiers.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Coupe l'accès aux capteurs dont l'application n'a pas besoin.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Force HTTPS pendant 1 an. Activé en prod uniquement (cf. compose.prod.yaml).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Masque la version de nginx dans les réponses et pages d'erreur.
    server_tokens off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Tout autre .php appelé directement est refusé : seul index.php est
    # un point d'entrée légitime (front controller Symfony).
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;

    error_log /var/log/nginx/cesizen_error.log;
    access_log /var/log/nginx/cesizen_access.log;
}
