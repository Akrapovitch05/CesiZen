; Configuration PHP — environnement de développement
memory_limit = 512M
display_errors = On
error_reporting = E_ALL
opcache.enable = 0

; Protection contre la fixation de session : un identifiant non genere par
; le serveur est refuse. Regle au niveau de PHP, pas de Symfony.
session.use_strict_mode = 1
session.cookie_httponly = 1
upload_max_filesize = 16M
post_max_size = 16M
date.timezone = Europe/Paris
