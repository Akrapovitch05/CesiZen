; Configuration PHP — environnement de production
memory_limit = 256M

; Aucune fuite d'information technique vers l'utilisateur final :
; une stack trace PHP renseigne un attaquant sur les chemins et versions.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /proc/self/fd/2

; OPcache en mode production : le code n'est jamais revalidé sur disque.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload = /var/www/html/config/preload.php
opcache.preload_user = www-data

; Masque la version de PHP dans l'en-tête X-Powered-By.
expose_php = Off

; Durcissement des sessions (cf. plan de sécurisation).
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

upload_max_filesize = 8M
post_max_size = 8M
date.timezone = Europe/Paris
