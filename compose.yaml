# ---------------------------------------------------------------------------
# Socle commun aux trois environnements CESIZen.
# Ne s'utilise pas seul : toujours combiné à une surcharge.
#   dev  : docker compose up -d                       (compose.override.yaml, automatique)
#   test : docker compose -f compose.yaml -f compose.test.yaml up -d
#   prod : docker compose -f compose.yaml -f compose.prod.yaml up -d
# ---------------------------------------------------------------------------
name: cesizen

services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cesizen}
      MYSQL_USER: ${MYSQL_USER:-cesizen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD doit etre defini dans .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD doit etre defini dans .env.local}
    volumes:
      - database_data:/var/lib/mysql:rw
    healthcheck:
      # Les services applicatifs n'attendent pas le conteneur, mais la base
      # réellement prête à accepter des connexions.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-cesizen}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE:-cesizen}?serverVersion=8.0.32&charset=utf8mb4
      APP_SECRET: ${APP_SECRET:?APP_SECRET doit etre defini dans .env.local}
    healthcheck:
      # nginx ne doit pas démarrer avant que PHP-FPM n'accepte réellement
      # les connexions, sous peine de renvoyer des 502 le temps du démarrage.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  database_data:
