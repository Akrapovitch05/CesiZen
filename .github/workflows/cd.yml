# ---------------------------------------------------------------------------
# Livraison continue CESIZen
#
# Le déploiement est déclenché par la pose d'un tag de version (v1.2.3) sur
# main, jamais par un simple push : une mise en production est toujours un
# acte volontaire et tracé.
#
# Enchaînement : artefact versionné, construit une seule fois
#                -> production (soumise à approbation humaine).
#
# L'artefact n'est jamais reconstruit entre sa fabrication et sa mise en
# service : ce qui est validé est exactement ce qui est livré.
# ---------------------------------------------------------------------------
name: Livraison continue

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à déployer (ex. v1.2.3)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # 1. Construction des artefacts versionnés.
  #
  #    Deux formats, pour deux usages :
  #    - l'image Docker garantit la reproductibilité des environnements de
  #      test et sert de référence d'exécution ;
  #    - l'archive de déploiement est la forme adaptée à la cible réelle,
  #      un hébergement mutualisé qui n'exécute pas de conteneurs.
  #
  #    Les deux sont produits une seule fois, à partir du même code source.
  # -------------------------------------------------------------------------
  artefact:
    name: Construction de l'artefact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.valeur }}
    steps:
      - name: Récupération des sources
        uses: actions/checkout@v4

      - name: Détermination de la version
        id: version
        run: echo "valeur=${GITHUB_REF_NAME:-${{ inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Normalisation du nom d'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Préparation de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ steps.image.outputs.nom }}:${{ steps.version.outputs.valeur }}
            ${{ steps.image.outputs.nom }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Même version de PHP que la cible de déploiement : construire avec une
      # version différente de celle qui exécute est une source classique de
      # défaut découvert seulement en production.
      - name: Préparation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # --no-dev exclut les outils de test et de débogage ; APP_ENV=prod est
      # indispensable, sans lui Symfony cherche à charger des bundles de
      # développement qui viennent d'être désinstallés.
      - name: Installation des dépendances de production
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress
        env:
          APP_ENV: prod

      - name: Préparation des fichiers front
        run: |
          php bin/console importmap:install
          php bin/console asset-map:compile
        env:
          APP_ENV: prod

      # var/ est exclu : le cache Symfony contient des chemins absolus propres
      # à la machine de construction et serait inexploitable sur la cible.
      - name: Compression de l'archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude=./.git \
            --exclude=./var \
            --exclude=./.env.local \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Conservation de l'archive
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ steps.version.outputs.valeur }}
          path: deploy.tar.gz
          retention-days: 30

  # -------------------------------------------------------------------------
  # 2. Production — soumise à une approbation manuelle.
  #
  #    L'environnement « production » est configuré dans les réglages du dépôt
  #    avec au moins un relecteur requis : le job démarre puis attend une
  #    validation humaine avant d'exécuter la moindre commande sur la cible.
  #
  #    La sauvegarde précède les migrations : un déploiement de code s'annule
  #    en redéployant la version précédente, une donnée supprimée ne se
  #    récupère pas.
  # -------------------------------------------------------------------------
  production:
    name: Déploiement en production
    runs-on: ubuntu-latest
    needs: [artefact]
    environment:
      name: production
      url: https://cesizen.akramkibout.fr
    steps:
      - name: Récupération de l'archive
        uses: actions/download-artifact@v4
        with:
          name: deploy-${{ needs.artefact.outputs.version }}

      # La clé privée provient des secrets du dépôt : elle n'apparaît jamais
      # dans le code et reste masquée dans les journaux d'exécution.
      # ssh-keyscan enregistre l'empreinte du serveur, sans quoi SSH
      # attendrait une confirmation interactive impossible à donner ici.
      - name: Préparation de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || {
            echo "::error::Connexion SSH refusée par l'hébergeur : l'adresse IP de l'exécuteur n'est pas dans la liste blanche."
            exit 1
          }

      - name: Sauvegarde de la base avant migration
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
          mkdir -p ~/backups-cesizen &&
          mariadb-dump kiak9632_cesizen | gzip > ~/backups-cesizen/prod-$(date +%Y%m%d-%H%M%S).sql.gz &&
          ls -lh ~/backups-cesizen | tail -3
          '

      - name: Transfert de l'archive
        run: scp -i ~/.ssh/deploy_key deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/

      # Les commandes sont chaînées par && : si l'une échoue, les suivantes ne
      # sont pas exécutées. Une migration ne part jamais sur une extraction
      # incomplète.
      - name: Mise en service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd ${{ secrets.DEPLOY_PATH }} &&
            tar -xzf ~/deploy.tar.gz &&
            mkdir -p var/cache var/log &&
            rm -rf var/cache/* &&
            php bin/console doctrine:migrations:migrate --no-interaction &&
            php bin/console cache:clear --env=prod &&
            php bin/console cache:warmup --env=prod &&
            rm ~/deploy.tar.gz
          '

      # Un déploiement n'est réussi que si l'application répond réellement.
      # En cas d'échec, le job « communication » ouvre un ticket d'incident.
      - name: Contrôle de disponibilité
        run: curl --fail --retry 5 --retry-delay 5 https://cesizen.akramkibout.fr/

  # -------------------------------------------------------------------------
  # 3. Communication — en cas de succès comme d'échec.
  #    Un échec ouvre automatiquement un ticket d'incident, ce qui déclenche
  #    le cycle de maintenance corrective décrit dans docs/maintenance.md.
  # -------------------------------------------------------------------------
  communication:
    name: Communication de fin de déploiement
    runs-on: ubuntu-latest
    needs: [artefact, production]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Déploiement réussi
        if: needs.production.result == 'success'
        run: echo "Version ${{ needs.artefact.outputs.version }} en production. Notification aux parties prenantes."

      - name: Échec du déploiement — ouverture d'un ticket d'incident
        if: needs.production.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] Échec du déploiement ${{ needs.artefact.outputs.version }}`,
              labels: ['incident-technique', 'gravite:bloquant', 'priorite:critique'],
              body: [
                '## Constat',
                'Le déploiement de la version `${{ needs.artefact.outputs.version }}` en production a échoué.',
                '',
                `Exécution concernée : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '## Actions immédiates',
                '- [ ] Vérifier que la version précédente est toujours en service',
                '- [ ] Analyser les journaux de l\'exécution',
                '- [ ] Décider : correction à chaud ou retour arrière',
                '',
                'Délais applicables : prise en compte 1 h ouvrée, correction 3 h ouvrées (incident bloquant critique).'
              ].join('\n')
            });