# ---------------------------------------------------------------------------
# Veille technologique automatisée.
#
# Dependabot surveille en continu les dépendances du projet et ouvre une
# pull request dès qu'une mise à jour est disponible. Chaque pull request
# passe par la chaîne d'intégration continue : une montée de version n'est
# fusionnée que si l'ensemble des tests de non-régression réussit.
#
# C'est le volet automatisé de la veille ; le volet humain (sources suivies,
# fréquence, critères de sélection) est décrit dans docs/veille.md.
# ---------------------------------------------------------------------------
version: 2

updates:
  # --- Dépendances PHP -----------------------------------------------------
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependances
      - veille
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Les correctifs mineurs sont regroupés en une seule pull request :
      # moins de bruit, une seule revue, une seule exécution de la CI.
      symfony-mineur:
        patterns: ["symfony/*"]
        update-types: ["minor", "patch"]
    ignore:
      # Les montées majeures de Symfony sont traitées comme des demandes
      # d'évolution planifiées, jamais comme une mise à jour de routine.
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]

  # --- Dépendances front ---------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependances
      - veille
    commit-message:
      prefix: "chore(deps)"

  # --- Images Docker -------------------------------------------------------
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels:
      - dependances
      - veille
      - infrastructure

  # --- Actions GitHub utilisées par la CI/CD -------------------------------
  # Une action non maintenue est un vecteur d'attaque sur la chaîne de build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependances
      - veille
